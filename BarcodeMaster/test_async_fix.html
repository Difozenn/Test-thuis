<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Fix Test</title>
</head>
<body>
    <h1>Testing Async Fix</h1>
    <div id="status">Testing...</div>

    <script>
        // Test the async/await pattern that was causing the error
        
        async function updatePerformanceMetrics() {
            console.log('✅ updatePerformanceMetrics is async - no syntax error');
            
            try {
                // Simulate the API call that was causing issues
                const response = await fetch('/api/project/TEST/productivity-metrics');
                console.log('✅ await syntax works correctly');
                return true;
            } catch (error) {
                console.log('✅ Error handling works (expected for test):', error.message);
                return false;
            }
        }

        async function initializePage() {
            console.log('✅ initializePage is async');
            
            // This call should not cause syntax errors anymore
            await updatePerformanceMetrics();
            console.log('✅ await updatePerformanceMetrics() works');
            
            document.getElementById('status').innerHTML = '✅ All async/await syntax tests passed!';
        }

        // Test the fix
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🧪 Testing async/await fix...');
            initializePage();
        });
    </script>
</body>
</html>
