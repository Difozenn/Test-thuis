<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstroosters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dienstroosters Systeem</h1>
            <div class="header-controls">
                <div class="week-selector">
                    <button id="prev-week">◄</button>
                    <span id="current-week">Week 1 - jan 2025</span>
                    <button id="next-week">►</button>
                </div>
                <button id="generate-schedule" class="btn-primary">Rooster Genereren</button>
                <button id="export-schedule" class="btn-secondary">CSV Exporteren</button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="left-sidebar">
                <div class="panel">
                    <h3>Medewerkers Beheer</h3>
                    <button id="add-person-btn" class="btn-small">Medewerker Toevoegen</button>
                    <div id="people-list" class="list-container"></div>
                </div>

                <div class="panel">
                    <h3>Beschikbaarheidskalender</h3>
                    <div id="availability-calendar">
                        <select id="person-select">
                            <option value="">Selecteer Medewerker</option>
                        </select>
                        <input type="date" id="absence-date">
                        <input type="text" id="absence-reason" placeholder="Reden">
                        <button id="mark-absence" class="btn-small">Afwezigheid Markeren</button>
                        <div id="absence-list"></div>
                    </div>
                </div>
            </aside>

            <main class="schedule-view">
                <div id="schedule-timeline">
                    <div class="timeline-header">
                        <div class="machine-label">Machines</div>
                        <div class="days-header" id="days-header"></div>
                    </div>
                    <div class="timeline-body" id="timeline-body"></div>
                </div>
            </main>

            <aside class="right-sidebar">
                <div class="panel">
                    <h3>Takenlijst</h3>
                    <button id="add-job-btn" class="btn-small">Taak Toevoegen</button>
                    <div id="job-list" class="list-container"></div>
                </div>

                <div class="panel">
                    <h3>Machines</h3>
                    <button id="add-machine-btn" class="btn-small">Machine Toevoegen</button>
                    <div id="machine-list" class="list-container"></div>
                </div>

                <div class="panel">
                    <h3>Taak Sjablonen</h3>
                    <button id="add-template-btn" class="btn-small">Sjabloon Toevoegen</button>
                    <div id="template-list" class="list-container"></div>
                </div>
            </aside>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Item Toevoegen</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <div id="job-progress-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Taak Voortgang Bijwerken</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="progress-form">
                    <div class="form-group">
                        <label>Taak: <span id="progress-job-name"></span></label>
                    </div>
                    <div class="form-group">
                        <label>Machine: <span id="progress-machine-name"></span></label>
                    </div>
                    <div class="form-group">
                        <label for="completed-quantity">Voltooide Hoeveelheid:</label>
                        <input type="number" id="completed-quantity" min="0">
                    </div>
                    <div class="form-group">
                        <label for="remaining-hours">Resterende Uren:</label>
                        <input type="number" id="remaining-hours" min="0" step="0.5">
                    </div>
                    <button type="submit" class="btn-primary">Voortgang Bijwerken</button>
                </form>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
