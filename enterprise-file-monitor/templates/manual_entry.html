<!-- templates/manual_entry.html -->
{% extends "base.html" %}

{% block title %}{{ t('manual_entry') }} - CNC Datalog{% endblock %}

{% block content %}
<!-- Page Header with Blue Underline -->
<div class="page-header">
    <h1>{{ t('manual_entry') }}</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description') }}</label>
                <input type="text" class="form-control" id="description" name="description"
                       placeholder="{{ t('placeholder_description') }}">
            </div>
            
            <div class="mb-3">
                <label for="category_id" class="form-label">{{ t('category') }}</label>
                <select class="form-select" id="category_id" name="category_id" required>
                    <option value="">{{ t('select_category') }}</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label for="monitored_path_id" class="form-label">{{ t('monitored_path') }} (Optional)</label>
                <select class="form-select" id="monitored_path_id" name="monitored_path_id">
                    <option value="">{{ t('none_manual_entry') }}</option>
                    {% for path in monitored_paths %}
                    <option value="{{ path.id }}">
                        {% if path.description %}
                            {{ path.description }} ({{ path.path }})
                        {% else %}
                            {{ path.path }}
                        {% endif %}
                    </option>
                    {% endfor %}
                </select>
                <div class="form-text">{{ t('optional_path_association') }}</div>
            </div>
            
            <div class="mb-3">
                <label for="amount" class="form-label">{{ t('amount') }}</label>
                <input type="number" class="form-control" id="amount" name="amount" min="1" max="100" value="1" required>
                <div class="form-text">{{ t('number_of_entries') }}</div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ t('add_entries') }}</button>
                <a href="{{ url_for('main.events') }}" class="btn btn-secondary">{{ t('cancel') }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
