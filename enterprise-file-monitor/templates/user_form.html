<!-- templates/user_form.html -->
{% extends "base.html" %}

{% block title %}{{ t('add_user_title') }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="h2">{{ t('add_user') }}</h1>
        <p class="text-muted">{{ t('create_new_user') }}</p>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">{{ t('username') }}</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">{{ t('email') }}</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">{{ t('password') }}</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <div class="mb-3">
                <label for="role" class="form-label">{{ t('role') }}</label>
                <select class="form-select" id="role" name="role">
                    <option value="operator">{{ t('operator') }}</option>
                    <option value="admin">{{ t('admin') }}</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="machine_type" class="form-label">Machine Type</label>
                <select class="form-select" id="machine_type" name="machine_type">
                    <option value="cnc" selected>CNC</option>
                    <option value="accura">Accura</option>
                </select>
                <small class="text-muted">Select the type of machine this user will be monitoring</small>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ t('create_user') }}</button>
                <a href="{{ url_for('main.users') }}" class="btn btn-secondary">{{ t('cancel') }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
